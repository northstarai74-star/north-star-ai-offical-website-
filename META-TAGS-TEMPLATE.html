<!--
  SEO Meta Tags Template for North Star AI

  This file shows recommended meta tags to add to each page for better SEO.
  Copy and adapt these for your pages.
-->

<!DOCTYPE html>
<html lang="en-GB">
<head>
  <!-- Essential Meta Tags -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- Page Title (50-60 characters) -->
  <title>North Star AI — The AI Receptionist for UK Dental Clinics</title>

  <!-- Meta Description (155-160 characters) -->
  <meta name="description" content="North Star AI answers every call, books appointments and follows up 24/7 — so your dental clinic never loses another patient to voicemail. Live in 7 days.">

  <!-- Keywords (Optional, but useful for planning) -->
  <meta name="keywords" content="AI receptionist, dental clinic, appointment booking, voice AI, UK dental">

  <!-- Canonical URL -->
  <link rel="canonical" href="https://northstarai.co.uk/">

  <!-- Language Declaration -->
  <meta http-equiv="Content-Language" content="en-GB">

  <!-- Open Graph Tags (Social Media) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="North Star AI — The AI Receptionist for UK Dental Clinics">
  <meta property="og:description" content="Stop losing patients to voicemail. North Star AI answers, books and follows up 24/7. Live in 7 days.">
  <meta property="og:url" content="https://northstarai.co.uk/">
  <meta property="og:site_name" content="North Star AI">
  <meta property="og:image" content="https://northstarai.co.uk/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="en_GB">

  <!-- Twitter Card Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="North Star AI — The AI Receptionist for UK Dental Clinics">
  <meta name="twitter:description" content="Stop losing patients to voicemail. North Star AI answers, books and follows up 24/7.">
  <meta name="twitter:image" content="https://northstarai.co.uk/og-image.png">
  <meta name="twitter:creator" content="@northstarai">
  <meta name="twitter:site" content="@northstarai">

  <!-- Additional SEO Meta Tags -->
  <!-- Google Site Verification (Add your verification code) -->
  <meta name="google-site-verification" content="YOUR_GOOGLE_VERIFICATION_CODE">

  <!-- Author -->
  <meta name="author" content="North Star AI">

  <!-- Copyright -->
  <meta name="copyright" content="© 2026 North Star AI. All rights reserved.">

  <!-- Theme Color -->
  <meta name="theme-color" content="#0a0f1e">

  <!-- Apple Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="North Star AI">
  <link rel="apple-touch-icon" href="https://northstarai.co.uk/logo.svg">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="shortcut icon" href="https://northstarai.co.uk/favicon.ico">

  <!-- Preconnect to External Domains (Performance) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- DNS Prefetch for Analytics (if used) -->
  <link rel="dns-prefetch" href="https://www.google-analytics.com">
  <link rel="dns-prefetch" href="https://www.googletagmanager.com">

  <!-- Mobile Optimization -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=yes">

  <!-- Robots Meta Tag -->
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">

  <!-- Structured Data / JSON-LD Schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfessionalService",
    "name": "North Star AI",
    "description": "AI voice receptionist for UK dental clinics",
    "url": "https://northstarai.co.uk/",
    "areaServed": "GB",
    "offers": {
      "@type": "AggregateOffer",
      "priceCurrency": "GBP",
      "lowPrice": "249"
    }
  }
  </script>

  <!-- Organization Schema (Optional) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "North Star AI",
    "url": "https://northstarai.co.uk/",
    "logo": "https://northstarai.co.uk/logo.svg",
    "description": "AI voice receptionist for UK dental clinics",
    "sameAs": [
      "https://twitter.com/northstarai",
      "https://linkedin.com/company/northstarai"
    ],
    "contactPoint": {
      "@type": "ContactPoint",
      "telephone": "+44-xxx-xxxx",
      "contactType": "Customer Service"
    }
  }
  </script>

  <!-- Breadcrumb Schema (For navigation pages) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      {
        "@type": "ListItem",
        "position": 1,
        "name": "Home",
        "item": "https://northstarai.co.uk/"
      },
      {
        "@type": "ListItem",
        "position": 2,
        "name": "Current Page",
        "item": "https://northstarai.co.uk/current-page.html"
      }
    ]
  }
  </script>

</head>

<body>
  <!-- Page Content -->

  <!-- Example: H1 Tag (Should be present, unique per page) -->
  <h1>North Star AI — The AI Receptionist for UK Dental Clinics</h1>

  <!-- Example: H2 and H3 Tags for Structure -->
  <h2>How It Works</h2>
  <h3>Never Miss a Patient Call</h3>
  <p>North Star AI answers every incoming call automatically...</p>

  <!-- Images should have alt text for accessibility and SEO -->
  <img src="feature.png" alt="North Star AI answering dental clinic calls">

  <!-- Internal Links with Descriptive Anchor Text -->
  <a href="/demo-booking.html">Book a demo of North Star AI</a>
  <a href="/privacy.html">Privacy Policy</a>

</body>
</html>

  KEY POINTS FOR SEO SUCCESS:

  1. Page Titles (50-60 chars)

     - Include primary keyword
     - Call to action
     - Be compelling/click-worthy

  3. Heading Structure
     - 1 H1 per page
     - Logical H2/H3 hierarchy
     - Include keywords naturally

  4. Internal Linking
     - Use descriptive anchor text
     - Link relevant pages together
     - Create a logical structure

  5. Image Alt Text
     - Describe the image
     - Include relevant keywords
     - Help visually impaired users

  6. Schema Markup
     - Helps search engines understand content
     - Creates rich snippets
     - Improves CTR

  7. Mobile Optimization
     - Mobile-first responsive design
     - Fast loading times
     - Touch-friendly elements

  8. Page Speed
     - Minimize CSS/JS
     - Optimize images
     - Enable compression
     - Use CDN

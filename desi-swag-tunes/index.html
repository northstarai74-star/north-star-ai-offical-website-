<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DESI SWAG TUNES - Music Streaming</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #000;
  color: #fff;
  font-family: 'Arial Black', sans-serif;
  overflow-x: hidden;
}

header {
  background: #111;
  border-bottom: 3px solid #00ff00;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
}

.logo {
  font-size: 2.5rem;
  font-weight: bold;
  color: #00ff00;
  text-shadow: 0 0 10px #00ff00, 0 0 20px #ff00ff;
  letter-spacing: 2px;
}

nav a {
  color: #00ff00;
  text-decoration: none;
  margin-left: 30px;
  font-weight: bold;
  font-size: 1.1rem;
  transition: all 0.3s;
}

nav a:hover {
  color: #ff00ff;
  text-shadow: 0 0 10px #ff00ff;
}

.hero {
  text-align: center;
  padding: 100px 20px;
  background: linear-gradient(180deg, #1a001a 0%, #000 100%);
  border-bottom: 3px solid #ff00ff;
  box-shadow: 0 0 30px rgba(255, 0, 255, 0.3);
}

.hero h1 {
  font-size: 5rem;
  margin-bottom: 20px;
  color: #ff00ff;
  text-shadow: 0 0 20px #ff00ff, 0 0 40px #00ff00;
  letter-spacing: 3px;
}

.hero p {
  font-size: 1.5rem;
  color: #00ff00;
  text-shadow: 0 0 10px #00ff00;
  margin-bottom: 30px;
}

.btn {
  display: inline-block;
  background: #ff00ff;
  color: #000;
  padding: 20px 50px;
  font-size: 1.3rem;
  font-weight: bold;
  border: 3px solid #00ff00;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.3s;
  box-shadow: 0 0 20px #ff00ff;
}

.btn:hover {
  background: #00ff00;
  color: #000;
  box-shadow: 0 0 40px #00ff00;
  transform: scale(1.1);
}

.features {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  padding: 60px 20px;
  background: #000;
}

.feature {
  background: #1a1a1a;
  border: 2px solid #00ff00;
  padding: 30px;
  text-align: center;
  box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
  transition: all 0.3s;
}

.feature:hover {
  border-color: #ff00ff;
  box-shadow: 0 0 30px #ff00ff;
  transform: scale(1.05);
}

.feature-icon {
  font-size: 3rem;
  margin-bottom: 15px;
}

.feature h3 {
  color: #00ff00;
  margin-bottom: 10px;
  font-size: 1.3rem;
}

.feature p {
  color: #aaa;
}

footer {
  background: #111;
  text-align: center;
  padding: 30px;
  border-top: 3px solid #00ff00;
  color: #00ff00;
  font-weight: bold;
  box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
}

@media (max-width: 1024px) {
  .features { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 768px) {
  .features { grid-template-columns: 1fr; }
  .hero h1 { font-size: 3rem; }
  nav a { margin-left: 10px; font-size: 0.9rem; }
}
</style>
</head>
<body>

<header>
  <div class="logo">🎵 DESI SWAG 🎵</div>
  <nav>
    <a href="/">HOME</a>
    <a href="/music.html">MUSIC</a>
  </nav>
</header>

<div class="hero">
  <h1>DESI SWAG TUNES</h1>
  <p>⚡ PREMIUM MUSIC STREAMING ⚡</p>
  <a href="/music.html" class="btn">🎧 PLAY NOW</a>
</div>

<div class="features">
  <div class="feature">
    <div class="feature-icon">🎵</div>
    <h3>5 TRACKS</h3>
    <p>Premium Quality</p>
  </div>
  <div class="feature">
    <div class="feature-icon">🎬</div>
    <h3>MUSIC VIDEO</h3>
    <p>HD Quality</p>
  </div>
  <div class="feature">
    <div class="feature-icon">📝</div>
    <h3>FULL LYRICS</h3>
    <p>All Songs</p>
  </div>
  <div class="feature">
    <div class="feature-icon">⚡</div>
    <h3>FAST STREAM</h3>
    <p>Zero Buffering</p>
  </div>
</div>

<footer>
  © 2026 DESI SWAG TUNES | Artist: Mr. Tarun Lakhanpal
</footer>

</body>
</html>
